<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" fill="#1925ff" rx="24"/>
  
  <!-- Gradient overlay for depth -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1925ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0815f9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5eaff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="128" height="128" fill="url(#grad)" rx="24"/>
  
  <!-- Energy bolt accent -->
  <g transform="translate(14, 14)">
    <path d="M 20 2 L 26 16 L 14 16 L 24 32 L 8 14 L 18 14 Z" fill="#4054ff" opacity="0.3"/>
  </g>
  
  <!-- BC Text -->
  <text x="64" y="75" font-size="52" font-weight="700" font-family="Poppins, sans-serif" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="middle" letter-spacing="-2">BC</text>
  
  <!-- Accent circle -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.2"/>
</svg>
